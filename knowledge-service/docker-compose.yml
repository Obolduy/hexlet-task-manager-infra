services:
  search:
    build: .
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - hf-cache:/root/.cache/huggingface

  mcp:
    build: .
    command: python mcp_server.py
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      - search

volumes:
  hf-cache:
