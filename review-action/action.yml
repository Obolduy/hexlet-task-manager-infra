name: 'AI PR review'
description: >-
  Агентное ревью PR: правила из AGENTS.md, спецификации из specs/ и,
  опционально, продуктовые знания через search_docs. Только читает —
  не блокирует сборку. Чекаут в вызывающем workflow должен быть с
  fetch-depth: 0, иначе git diff между базовой веткой и веткой PR не сработает.
inputs:
  api-key:
    description: 'API-ключ OpenRouter для модели-ревьюера'
    required: true
  search-url:
    description: >-
      Базовый URL сервиса семантического поиска (POST {search-url}/search).
      Если не задан, ревьюер работает без search_docs.
    required: false
    default: ''
  model:
    description: 'Идентификатор модели OpenRouter, например anthropic/claude-3.5-haiku'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Prepare Python environment
      shell: bash
      run: |
        set -euo pipefail
        python_bin=""
        for candidate in python3.13 python3.12 python3.11 python3.10 \
                         /opt/homebrew/bin/python3 /usr/local/bin/python3 python3; do
          path="$(command -v "$candidate" 2>/dev/null || true)"
          [ -n "$path" ] || continue
          if "$path" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)'; then
            python_bin="$path"
            break
          fi
        done
        if [ -z "$python_bin" ]; then
          echo "::error::не найден Python 3.10+; review.py использует синтаксис 3.10+"
          exit 1
        fi
        echo "используем $python_bin ($("$python_bin" -V))"
        "$python_bin" -m venv "${{ runner.temp }}/review-venv"
        "${{ runner.temp }}/review-venv/bin/pip" install \
          --quiet --disable-pip-version-check \
          -r "${{ github.action_path }}/requirements.txt"

    - name: Run reviewer
      shell: bash
      run: '"${{ runner.temp }}/review-venv/bin/python" "${{ github.action_path }}/review.py"'
      env:
        OPENROUTER_API_KEY: ${{ inputs.api-key }}
        OPENROUTER_MODEL: ${{ inputs.model }}
        SEARCH_URL: ${{ inputs.search-url }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPO_PATH: ${{ github.workspace }}
